name: Build and deploy NESCO Elevators

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website source
        run: |
          rm -rf build
          mkdir build
          unzip -q NESCO_ELEVATORS_GITHUB_PAGES_SOURCE.zip -d build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: build/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Install dependencies
        working-directory: build
        run: pnpm install --frozen-lockfile

      - name: Build website
        working-directory: build
        run: pnpm build

      - name: Prepare GitHub Pages artifact
        run: |
          cp build/dist/public/index.html build/dist/public/404.html
          printf '%s
' 'nescoelevators.in' > build/dist/public/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
